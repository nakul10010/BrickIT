databases:
  - name: brickflow-demo-db
    plan: free
    databaseName: brickflow
    user: brickflow

services:
  - type: web
    name: brickflow-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn brickflow.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brickflow-demo-db
          property: connectionString
