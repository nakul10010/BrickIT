{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password · BrickIT</title>
    <link rel="stylesheet" href="{% static 'core/site.css' %}?v=20261023-19">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="brand login-brand" href="{% url 'login' %}"><span class="brand-mark">B</span><span>BrickIT<small>BUSINESS MANAGER</small></span></a>
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Forgot password?</h1>
        <p class="subtitle">Enter your username. We’ll send a one-time code to the mobile number registered to that account.</p>
        <form method="post" class="login-form">
            {% csrf_token %}
            <div><label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" required></div>
            <button class="button" type="submit">Send OTP</button>
        </form>
        <p class="login-help"><a href="{% url 'login' %}">Back to sign in</a></p>
    </main>
</body>
</html>
