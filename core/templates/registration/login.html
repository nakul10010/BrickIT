{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · BrickIT</title>
    <link rel="stylesheet" href="{% static 'core/site.css' %}?v=20261023-19">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="brand login-brand" href="#"><span class="brand-mark">B</span><span>BrickIT<small>BUSINESS MANAGER</small></span></a>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in</h1>
        <p class="subtitle">Sign in to manage Gomti Bricks.</p>
        {% if form.errors %}<p class="login-error" role="alert">The username or password is incorrect. Please try again.</p>{% endif %}
        <form method="post" class="login-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div><label for="id_username">Username</label>{{ form.username }}</div>
            <div><label for="id_password">Password</label>{{ form.password }}</div>
            <button class="button" type="submit">Sign in</button>
        </form>
        <p class="login-help"><a href="{% url 'forgot_password' %}">Forgot password?</a></p>
    </main>
</body>
</html>
